name: Build & Push Docker to ECR

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ap-northeast-2
      ECR_REPO: bookripple

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Give permission to execute gradlew
        run: chmod +x ./gradlew

      - name: Build jar (app.jar)
        run: ./gradlew clean build -x test

      - name: Verify jar build output
        run: ls -al build/libs/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push Docker image
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ECR_URI=${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com
          TAG=${GITHUB_SHA}

          docker build -t ${ECR_URI}/${ECR_REPO}:${TAG} .
          docker push ${ECR_URI}/${ECR_REPO}:${TAG}

          echo "ECR_IMAGE_URI=${ECR_URI}/${ECR_REPO}:${TAG}" >> $GITHUB_ENV
          echo "Pushed: ${ECR_URI}/${ECR_REPO}:${TAG}"

      - name: Print image uri
        run: echo "${ECR_IMAGE_URI}"
