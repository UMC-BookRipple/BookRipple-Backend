spring:
  datasource:
    url: ${LOCAL_DB_URL}
    username: ${LOCAL_DB_USER}
    password: ${LOCAL_DB_PW}
    driver-class-name: ${LOCAL_DB_DRIVER:com.mysql.cj.jdbc.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:1800000}  # 30분
  refresh-token-expiration-ms: ${JWT_REFRESH_TOKEN_EXPIRATION_MS:1209600000}  # 14일

aws:
  ses:
    from-email: ${AWS_SES_FROM_EMAIL:noreply@bookripple.site}
    region: ${AWS_REGION:ap-northeast-2}
    enabled: false  # 로컬에서는 Mock 사용

logging:
  level:
    org.hibernate.SQL: DEBUG

gemini:
  api:
    key: ${GEMINI_KEY}
    url: ${GEMINI_URL}


aladin:
  base-url: ${ALADIN_BASE_URL}
  ttb-key: ${ALADIN_TTB_KEY}
  output: js
  version: 20131101

kakao:
  client-id: ${KAKAO_CLIENT_ID}
  client-secret: ${KAKAO_CLIENT_SECRET}
  redirect-uri: ${KAKAO_REDIRECT_URI}  # 로컬 테스트 주소
  token-uri: https://kauth.kakao.com/oauth/token
  user-info-uri: https://kapi.kakao.com/v2/user/me
