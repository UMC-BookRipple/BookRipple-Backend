spring:
  application:
    name: bookripple-backend
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true

jwt:
  access-token-expiration-ms: 1800000  # 30분
  refresh-token-expiration-ms: 1209600000  # 14일

server:
  port: 8080

logging:
  level:
    root: INFO
    org.springframework.security: INFO

springdoc:
  use-fqn: true