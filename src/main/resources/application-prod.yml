spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PW}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  jwt:
    secret: ${JWT_SECRET} # 서버의 .env에 있는 값을 읽어옴
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:1800000}

logging:
  level:
    root: INFO

gemini:
  api:
    key: ${GEMINI_KEY}
    url: ${GEMINI_URL}

server:
  forward-headers-strategy: framework
  tomcat:
    basedir: ${APP_DIR:/home/ec2-user/app}/tomcat
    accesslog:
      enabled: true
      directory: ${APP_DIR:/home/ec2-user/app}/logs
      prefix: access
      suffix: .log
      pattern: '%h %l %u %t "%r" %s %b %D'
